name: Deferred develop health

# Consolidate rapid agent commits into one bounded, headless daily health check.
# GitHub schedules load this workflow from the default branch (main);
# the checked-out source is explicitly the *latest develop* revision.
# It becomes active after the owner manually merges this workflow into main.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoothcast-deferred-develop
  cancel-in-progress: true

env:
  SMOOTHCAST_TEST_CONTEXT: '1'

jobs:
  nightly:
    name: Latest develop — bounded software smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Record exact develop revision
        run: |
          echo "Verified develop SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a deferred diagnostic, never permission to merge main." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact develop CI verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/ci/head_verdict.py --json --head "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/develop-verdict.json"
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/develop-verdict.json" "$result" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          if path.stat().st_size:
              verdict = json.loads(path.read_text(encoding="utf-8"))
              print("### Exact develop CI verdict")
              print(f"- Head: `{verdict['head']}`")
              print(f"- Software: **{verdict['software']}**; release: **{verdict['release']}**")
              print(f"- Verdict: **{verdict['verdict']}**")
              if verdict.get("url"):
                  print(f"- Verify run: {verdict['url']}")
              for blocker in verdict.get("blockers", []):
                  print(f"- Blocker: {blocker}")
          else:
              print("### Exact develop CI verdict unavailable")
              print("`head_verdict.py` could not read a conclusive exact-head verdict.")
          PY
          exit "$result"
      - name: Publish recent commit-to-red timing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits?sha=develop&per_page=100" \
            --jq '.[] | [.sha, .commit.committer.date] | @tsv' \
            > "$RUNNER_TEMP/develop-commits.tsv"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=develop&per_page=100" \
            --jq '.workflow_runs[] | [.head_sha, (.conclusion // ""), .updated_at, .event] | @tsv' \
            > "$RUNNER_TEMP/develop-runs.tsv"
          python3 scripts/ci/time_to_red.py \
            --commits-tsv "$RUNNER_TEMP/develop-commits.tsv" \
            --runs-tsv "$RUNNER_TEMP/develop-runs.tsv" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Install headless diagnostics
        run: python -m pip install -e '.[dev]'
      - name: Fast static safeguards
        run: |
          python -m compileall -q src scripts setup tests
          ruff check src scripts setup tests smoothcast setup.py
      - name: Representative security and reliability regressions
        run: >-
          python -m pytest -q
          tests/test_portal_commands.py
          tests/test_mesh_file_wire_bounds.py
          tests/test_chrome_ingress_session.py
          tests/test_mesh_cast_planner.py
          tests/test_chrome_mesh_readiness.py
          tests/test_owner_ci_policy.py
