name: CodeQL

# Weekly deep static analysis or an explicit security review.
# CodeQL on every develop push duplicates work as agents commit rapidly.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# One scheduled/manual scan per ref; no repeated analysis per commit.
concurrency:
  group: smoothcast-codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:python
