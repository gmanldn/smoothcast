name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    # The auto-release PR (develop -> main) already runs CodeQL on push.
    branches: [develop]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# Retain weekly scans and latest pending per branch without wasting runners
# on queued superseded commit analyses. Running scans finish, not starve.
concurrency:
  group: smoothcast-codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:python
