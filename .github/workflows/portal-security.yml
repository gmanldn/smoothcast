name: Portal Security Regressions

on:
  push:
    branches: [develop]
    paths:
      - 'src/portal.py'
      - 'src/portal_join.py'
      - 'src/portal_room.py'
      - 'src/portal_commands.py'
      - 'src/portal_uploads.py'
      - 'src/cast_portal.py'
      - 'src/cast_ui.py'
      - 'tests/test_portal*.py'
      - '.github/workflows/portal-security.yml'
  pull_request:
    paths:
      - 'src/portal.py'
      - 'src/portal_join.py'
      - 'src/portal_room.py'
      - 'src/portal_commands.py'
      - 'src/portal_uploads.py'
      - 'src/cast_portal.py'
      - 'src/cast_ui.py'
      - 'tests/test_portal*.py'
      - '.github/workflows/portal-security.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SMOOTHCAST_TEST_CONTEXT: '1'

jobs:
  portal-security:
    name: Auth, uploads and room control (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install the application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test loopback room authentication, revocation and uploads
        run: >-
          python -m pytest -q
          tests/test_portal.py
          tests/test_portal_join.py
          tests/test_portal_room.py
          tests/test_portal_commands.py
          tests/test_portal_uploads.py
          tests/test_portal_queue.py
          tests/test_room_conformance.py

  gtk-portal-smoke:
    name: Isolated GTK host-control smoke (Xvfb)
    needs: [portal-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK and private virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-gi python3-venv gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Install SmoothCast in a native-PyGI environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .portal-gtk-venv
          .portal-gtk-venv/bin/python -m pip install -e .
      - name: Smoke GTK widget construction on a private Xvfb display
        env:
          SMOOTHCAST_TEST_CONTEXT: '0'
        run: .portal-gtk-venv/bin/python scripts/test_gui_isolated.py
