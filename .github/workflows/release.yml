name: Release SmoothCast

# Tagging a commit already on main publishes a GitHub release; run it by hand
# (Actions -> Release SmoothCast -> Run workflow) without "publish" for a dry
# run that builds everything and uploads the files as a workflow artifact.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify against src/version.py, e.g. v1.0.58'
        required: true
        type: string
      publish:
        description: 'Create the release (the tag must already exist)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SMOOTHCAST_TEST_CONTEXT: '1'

jobs:
  release:
    name: Build and (optionally) publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Tag must match src/version.py
        run: python scripts/ci/release_artifacts.py check-tag "$TAG"
      - name: Release commit must be on main
        if: env.PUBLISH == 'true'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build sdist and wheel
        run: |
          python -m pip install 'build>=1,<2' 'setuptools>=77' 'wheel>=0.45'
          python -m build --outdir dist .
      - name: Prove the built wheel installs and runs headlessly
        run: python scripts/ci/verify_installed_artifact.py
      - name: Checksums and release notes
        run: |
          python scripts/ci/release_artifacts.py checksums dist
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)"
          python scripts/ci/release_artifacts.py notes "$TAG" ${PREVIOUS:+--previous "$PREVIOUS"} --ref "$GITHUB_SHA" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoothcast-${{ env.TAG }}
          path: |
            dist/*
            RELEASE_NOTES.md
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "SmoothCast $TAG" --notes-file RELEASE_NOTES.md
