name: Verify SmoothCast

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# This workflow is deliberately headless, on every runner and child process.
# Real GTK smoke tests live outside this default verification path.
env:
  SMOOTHCAST_TEST_CONTEXT: '1'

concurrency:
  group: smoothcast-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.9'
      - name: Lint (configuration in pyproject.toml)
        run: ruff check src scripts setup tests sc.py setup.py

  portable-tests:
    name: Portable regressions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax without GTK
        run: python -m compileall -q src scripts setup tests

      - name: Install portable test dependencies
        run: python -m pip install 'pytest>=8,<10' 'pytest-cov>=5'

      - name: Run all portable regression tests
        if: matrix.python-version != '3.13'
        run: python -m pytest -q tests

      - name: Run all portable regression tests with coverage
        if: matrix.python-version == '3.13'
        # Baseline measured 40% line coverage on 19 Nov 2026; the gate sits
        # just below it and may only be raised.
        run: python -m pytest -q tests --cov=src --cov-report=term --cov-fail-under=38

      - name: Prove tests cannot see a simulated active desktop
        env:
          DISPLAY: ':0'
          WAYLAND_DISPLAY: 'wayland-0'
          DBUS_SESSION_BUS_ADDRESS: 'unix:path=/tmp/smoothcast-test-live-bus'
          XAUTHORITY: '/tmp/smoothcast-test-live-xauthority'
          SMOOTHCAST_GUI_TEST_ISOLATED: '1'
        run: python -m pytest -q tests/test_gui_test_safety.py

  media-integration:
    name: FFmpeg MKV/SRT runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg with bounded signed-mirror failover
        run: |
          # Avoid unbounded downloads from a regionally slow apt mirror;
          # failure is NOT a pass: actual FFmpeg codec tests remain mandatory.
          python scripts/ci/ensure_ffmpeg.py
          command -v ffmpeg
          command -v ffprobe
      - name: Verify required encoders and caption filter
        run: |
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          grep -q libx264 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q mpeg4 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q aac "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q subtitles "$RUNNER_TEMP/ffmpeg-filters.txt"
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Run actual FFmpeg decoder and subtitle tests
        run: python -m pytest -q tests/test_subtitle_encoding.py tests/test_preflight.py tests/test_dlna.py

  setup-contract:
    name: Setup contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m compileall -q setup
      - name: Exercise Python-only setup contracts without installing packages
        run: python -m unittest discover -s tests -p "test_setup_bootstrap.py" -v
      - name: Install portable test dependencies
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify persisted native runtime on this operating system
        run: python -m pytest -q tests/test_native_runtime_manifest.py
      - name: Verify pinned Homebrew installer rejection and execution gating
        run: python -m pytest -q tests/test_homebrew_verify.py

  installed-artifact:
    name: Installed wheel contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated Python artifact build tools
        run: python -m pip install 'build>=1,<2' 'setuptools>=77' 'wheel>=0.45'
      - name: Build sdist, rebuild wheel, then check a fresh installed runtime
        run: python scripts/ci/verify_installed_artifact.py
