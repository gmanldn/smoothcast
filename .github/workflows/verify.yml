name: Verify SmoothCast

on:
  push:
    branches: [main, develop]
  pull_request:
    # Contributor PRs into develop only. The long-lived release PR targets main;
    # its head is the very same develop SHA, already checked by the push lane.
    branches: [develop]

permissions:
  contents: read

# This workflow is deliberately headless, on every runner and child process.
# Real GTK smoke tests live outside this default verification path.
env:
  SMOOTHCAST_TEST_CONTEXT: '1'

# Busy develop has one running verification plus its newest pending commit.
# Do NOT cancel the running one: ongoing pushes must not starve validation.
# GitHub replaces an older pending run with the latest; any release promotion
# still requires all gates to pass for the EXACT tested SHA and checks HEAD.
# Distinct refs (main and contributor PRs) do not cancel each other.
concurrency:
  group: smoothcast-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Test lane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Patch fast lane or minor/major full lane?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Pending develop runs can be superseded. Compare against the last
          # released main instead of the immediately previous push; otherwise
          # a MINOR/MAJOR bump in a cancelled run could skip the full matrix.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            git fetch origin main
            BASE="$(git rev-parse origin/main)"
          fi
          lane="$(python scripts/ci/test_scope.py --base "$BASE" --head "$GITHUB_SHA")"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "Test lane: **$lane**" >> "$GITHUB_STEP_SUMMARY"

  syntax:
    name: Fast syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check Python syntax without GTK
        run: python -m compileall -q src scripts setup tests
      - name: Check canonical launcher syntax
        run: python -m py_compile smoothcast
      - name: Verify release promotion race safety
        run: python -m unittest discover -s tests -p test_release_automation.py
      - name: Enforce bounded CI queue and exact-release contracts
        run: python -m unittest discover -s tests -p test_ci_burst_policy.py
      - name: Verify ticket digest selection and fallback
        run: python -m unittest discover -s tests -p test_ticket_efficiency.py
      - name: Verify stale-safe per-ticket version bumps
        run: python -m unittest discover -s tests -p test_ticket_versioning.py
      - name: Verify exact-head CI verdict does not trust stale checks
        run: python -m unittest discover -s tests -p test_head_verdict.py
      - name: Verify GTK dependency bootstrap never bypasses import gate
        run: python -m unittest discover -s tests -p test_gtk_ci_deps.py
      - name: Verify bounded agent routing and instruction budgets
        run: |
          python -m unittest discover -s tests -p test_agent_context.py
          python -m unittest discover -s tests -p test_agent_token_efficiency.py
      - name: Lint user-facing UX copy
        run: python scripts/ci/ux_copy_lint.py
      - name: Enforce safety invariant evidence links
        run: python scripts/ci/check_invariants.py
      - name: Check the generated error catalogue is current
        run: python scripts/ci/gen_errors_doc.py --check
      - name: Block new silent broad playback exceptions
        run: |
          python scripts/ci/lint_silent_except.py
          python -m unittest discover -s tests -p test_silent_except_lint.py
      - name: Verify DLNA responder failures never break discovery or leak details
        run: python -m unittest discover -s tests -p test_dlna_discovery_failures.py
      - name: Verify bounded receiver-learning persistence
        run: python -m unittest discover -s tests -p test_receiver_memory.py
      - name: Verify code and issue-body budget contracts
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_chrome_ingress_session.py tests/test_mesh_cast_planner.py tests/test_chrome_mesh_readiness.py
          python -m pytest -q tests/test_complexity_budget.py tests/test_issue_body_budget.py tests/test_desktop_failure_notice.py tests/test_notifications.py tests/test_panel_ui.py
          python -m pytest -q tests/test_update_control.py tests/test_launch_singleton.py tests/test_version_integrity.py tests/test_stale_runtime_notice.py
      - name: Verify mesh Range resume integrity
        run: python -m pytest -q tests/test_mesh_files.py
      - name: Verify browser upload resumability and bounded chunks
        run: python -m pytest -q tests/test_portal_uploads.py
      - name: Verify bounded federated search cursors
        run: python -m unittest discover -s tests -p test_federated_cursor.py
      - name: Verify bounded local library search cursors
        run: python -m unittest discover -s tests -p test_local_search_cursor.py
      - name: Verify no-device demo profile safety
        run: |
          python -m unittest discover -s tests -p test_demo_session.py
          python -m pytest -q tests/test_demo_entrypoint_guard.py
          python -m unittest discover -s tests -p test_demo_cli_guard.py
      - name: Verify synthetic media source corpus
        run: python -m pytest -q tests/test_media_matrix_descriptions.py tests/test_media_matrix_generated.py
      - name: Verify Cast HLS frame-rate compatibility
        run: python -m pytest -q tests/test_transcode_fps_cap.py
      - name: Verify bounded room activity privacy and command receipts
        run: python -m pytest -q tests/test_room_activity.py tests/test_room_activity_safety.py

  mesh-protocol-contract:
    name: Mesh protocol safety (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pytest and mesh simulation dependencies
        run: python -m pip install 'pytest>=8,<10' 'hypothesis>=6,<7'
      - name: Verify v1 handshakes, schema safety and simulated mixed-version nodes
        run: >-
          python -m pytest -q
          tests/test_peer_protocol.py
          tests/test_mesh_protocol.py
          tests/test_mesh_model.py::test_protocol_negotiation
          tests/test_mesh_sync.py::test_steady_state_egress_and_event_rate_stay_within_budget_at_twenty_nodes
          tests/test_mesh_sync.py::test_loss_and_a_partition_with_edits_on_both_sides_converge_after_healing
          tests/test_mesh_sync.py::test_large_records_are_chunked_under_the_reply_cap
      - name: Verify desktop playback and timer contracts
        run: >-
          python -m pytest -q
          tests/test_chapter_navigation.py
          tests/test_transport_feedback.py
          tests/test_sparse_thumbnail_cache.py
          tests/test_aspect_override.py
          tests/test_idle_timers.py
          tests/test_responsive_wiring.py
          tests/test_mpris.py
      - name: Verify low-end CPU adaptation and real 720p filter contracts
        run: >-
          python -m pytest -q
          tests/test_low_end_policy.py
          tests/test_low_end_encoding.py
          tests/test_low_end_probe.py

  reliability-benchmark:
    name: Fake Cast reliability benchmark
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Cast client
        run: python -m pip install 'PyChromecast>=13.1.0,<15'
      - name: Measure loopback CASTV2 dispatch to PLAYING
        env:
          SMOOTHCAST_BENCHMARK_RUNNER: ubuntu-24.04-py3.13
        run: >-
          python scripts/reliability_benchmark.py
          --iterations 7
          --baseline docs/reliability-baseline-ubuntu-24.04.json
          --output reliability-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-benchmark-${{ github.sha }}
          path: reliability-benchmark.json
          if-no-files-found: error
          retention-days: 30

  search-performance:
    name: Search performance gates
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: House search budgets on 100k-entry synthetic libraries
        env:
          SMOOTHCAST_PERF: '1'
          SMOOTHCAST_PERF_SLACK: '3'
        run: python -m pytest -q tests/perf -s -p no:cacheprovider

  import-budget:
    name: Startup import budget
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK bindings (system Python)
        run: python3 scripts/ci/install_gtk_import_deps.py
      - name: Heavy modules stay off the GUI startup path (no window is opened)
        env:
          SMOOTHCAST_IMPORT_SLACK: '2'
        run: /usr/bin/python3 scripts/ci/import_budget.py

  lint:
    name: Ruff lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.9'
      - name: Lint (configuration in pyproject.toml)
        run: ruff check src scripts setup tests smoothcast setup.py

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Install mypy
        run: python -m pip install 'mypy==2.3.1'
      - name: Check the modules listed in pyproject.toml
        run: mypy

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Audit the resolved runtime dependencies
        # Resolves catt (bounded in pyproject.toml) and its dependencies, then
        # fails on any known vulnerability. Not a lock file: see testing.md.
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install .
          python -m pip_audit --path "$RUNNER_TEMP/audit-env/lib" --strict

  portable-tests:
    name: Portable regressions (Python ${{ matrix.python-version }})
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    # Full Python 3.10 pytest exceeded 12 minutes on loaded shared runners.
    # Do not skip tests or weaken coverage; use a bounded larger allowance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml

      - name: Check Python syntax without GTK
        run: python -m compileall -q src scripts setup tests

      - name: Check canonical launcher syntax
        run: python -m py_compile smoothcast

      - name: Install portable test dependencies
        run: python -m pip install 'pytest>=8,<10' 'pytest-cov>=5' 'pytest-xdist>=3,<4' 'hypothesis>=6,<7' 'PyChromecast>=13.1.0,<15' 'catt>=0.12,<0.14'

      - name: Run all portable regression tests
        if: matrix.python-version != '3.13'
        env:
          SMOOTHCAST_RUN_CATT_CONTRACT: '1'
        run: python -m pytest -q tests -n auto

      - name: Run all portable regression tests with coverage
        if: matrix.python-version == '3.13'
        env:
          SMOOTHCAST_RUN_CATT_CONTRACT: '1'
        # Baseline measured 40% line coverage on 19 Nov 2026; the gate sits
        # just below it and may only be raised.
        run: python -m pytest -q tests --cov=src --cov-report=term --cov-fail-under=38 -n auto

      - name: Prove tests cannot see a simulated active desktop
        env:
          DISPLAY: ':0'
          WAYLAND_DISPLAY: 'wayland-0'
          DBUS_SESSION_BUS_ADDRESS: 'unix:path=/tmp/smoothcast-test-live-bus'
          XAUTHORITY: '/tmp/smoothcast-test-live-xauthority'
          SMOOTHCAST_GUI_TEST_ISOLATED: '1'
        run: python -m pytest -q tests/test_gui_test_safety.py

  # The portable suite on the native desktop OSes (#258). It gates like every
  # other job (and release promotion). A test that cannot pass on an OS is listed
  # with a reason in tests/platform_gaps.py; fix the cause and delete the entry.
  portable-tests-native:
    name: Portable regressions (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml

      - name: Install portable test dependencies
        # PyChromecast drives CASTV2 loopback integration; psutil is used for
        # native process-identity checks.
        run: python -m pip install 'pytest>=8,<10' 'pytest-xdist>=3,<4' 'hypothesis>=6,<7' 'psutil>=5.9,<8' 'PyChromecast>=13.1.0,<15'

      - name: Run all portable regression tests
        run: python -m pytest -q tests -p no:cacheprovider --tb=short -n auto

  media-integration:
    name: FFmpeg MKV/SRT runtime integration
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Install FFmpeg with bounded signed-mirror failover
        run: |
          # Avoid unbounded downloads from a regionally slow apt mirror;
          # failure is NOT a pass: actual FFmpeg codec tests remain mandatory.
          python scripts/ci/ensure_ffmpeg.py
          command -v ffmpeg
          command -v ffprobe
      - name: Verify required encoders and caption filter
        run: |
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          grep -q libx264 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q mpeg4 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q aac "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q subtitles "$RUNNER_TEMP/ffmpeg-filters.txt"
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Run actual FFmpeg decoder and subtitle tests
        env:
          SMOOTHCAST_REAL_FFMPEG: "1"   # enables tests/test_video_policy_ffmpeg.py
        run: python -m pytest -q tests/test_subtitle_encoding.py tests/test_preflight.py tests/test_dlna.py tests/test_video_policy_ffmpeg.py tests/test_audio_delay_ffmpeg.py

  setup-contract:
    name: Setup contract (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Check Python syntax
        run: python -m compileall -q setup
      - name: Exercise Python-only setup contracts without installing packages
        run: python -m unittest discover -s tests -p "test_setup_bootstrap.py" -v
      - name: Install portable test dependencies
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify persisted native runtime on this operating system
        run: python -m pytest -q tests/test_native_runtime_manifest.py
      - name: Verify pinned Homebrew installer rejection and execution gating
        run: python -m pytest -q tests/test_homebrew_verify.py

  installed-artifact:
    name: Installed wheel contract (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/verify.yml
      - name: Install isolated Python artifact build tools
        run: python -m pip install 'build>=1,<2' 'setuptools>=77' 'wheel>=0.45'
      - name: Build sdist, rebuild wheel, then check a fresh installed runtime
        run: python scripts/ci/verify_installed_artifact.py

  # develop -> main, automatically, for verified releases. Patch progress takes
  # the fast lane; only MINOR/MAJOR bumps run the full test matrix. `main` is
  # release-only and the repository ruleset requires a pull request, so the
  # job opens one and merges it with the head pinned to the verified commit.
  promote-release:
    name: Promote verified release to main
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.scope.result == 'success' &&
      needs.mesh-protocol-contract.result == 'success' &&
      needs.syntax.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.import-budget.result == 'success' &&
      (needs.reliability-benchmark.result == 'success' || needs.reliability-benchmark.result == 'skipped') &&
      (needs.search-performance.result == 'success' || needs.search-performance.result == 'skipped') &&
      (needs.portable-tests.result == 'success' || needs.portable-tests.result == 'skipped') &&
      (needs.portable-tests-native.result == 'success' || needs.portable-tests-native.result == 'skipped') &&
      (needs.media-integration.result == 'success' || needs.media-integration.result == 'skipped') &&
      (needs.setup-contract.result == 'success' || needs.setup-contract.result == 'skipped') &&
      (needs.installed-artifact.result == 'success' || needs.installed-artifact.result == 'skipped')
    needs: [scope, syntax, mesh-protocol-contract, reliability-benchmark, lint, typecheck, dependency-audit, portable-tests, portable-tests-native, media-integration, setup-contract, installed-artifact, search-performance, import-budget]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: smoothcast-promote-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Is this verified commit a new release?
        id: decide
        run: |
          git fetch origin develop main
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
            echo "::notice::develop has moved past this commit; the newer verified commit will promote."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          tag="$(python scripts/ci/promote_release.py check "$GITHUB_SHA")" || code=$?
          if [ "$code" -eq 10 ]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "promote=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open and merge the release pull request
        if: steps.decide.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
            echo "::notice::develop advanced after release verification; a newer verified run will promote."
            exit 0
          fi
          number="$(gh pr list --head develop --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --head develop --base main --title "Release $TAG" \
              --body "Automated promotion of verified develop commit $GITHUB_SHA ($TAG). All Verify jobs passed on this commit. Publishing is a separate, explicit tag step: see docs/agents/workflow.md.")" || {
              git fetch origin develop || {
                echo "::error::Cannot recheck develop after PR creation failure; release promotion refused."
                exit 1
              }
              if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
                echo "::notice::develop advanced during release PR creation; a newer verified run will promote."
                exit 0
              fi
              echo "::error title=Release promotion needs a repository setting::Every verification job passed and $TAG is a new release, but GitHub refused to open the develop->main pull request. A repository admin must enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'. This is configuration, not a code failure."
              exit 1
            }
            number="${url##*/}"
          fi
          gh pr merge "$number" --merge --match-head-commit "$GITHUB_SHA" || {
            git fetch origin develop || {
              echo "::error::Cannot recheck develop after PR merge failure; release promotion refused."
              exit 1
            }
            if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
              echo "::notice::develop advanced during release PR merge; a newer verified run will promote."
              exit 0
            fi
            echo "::error title=Release promotion could not merge::The verified develop head did not change, but release PR #$number could not be merged at $GITHUB_SHA. Check the MainProtector ruleset: its 'update' rule only lets bypass actors move main, so the GitHub Actions app must be on the ruleset bypass list (Settings > Rules > Rulesets > MainProtector > Bypass list > Add GitHub Actions, mode: always). See the log above."
            exit 1
          }
