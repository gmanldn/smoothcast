name: Package SmoothCast

# Build only when packaging inputs change, on a real release tag, or by
# explicit dispatch. A continuously updated develop -> main release PR carries
# the entire unmerged diff and must NOT rebuild three platforms on every push.
# Native packaging is expensive. Never rebuild for ordinary develop pushes.
# The owner requests a build explicitly, or a published version tag triggers it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Coalesce manual requests per ref, retain tag-specific release builds.
concurrency:
  group: smoothcast-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Never start the actual GUI or contact a receiver during artifact checks.
env:
  SMOOTHCAST_TEST_CONTEXT: '1'

jobs:
  linux:
    name: PyInstaller / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK4/libadwaita, Python GI and media prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-good libgtk-4-media-gstreamer ffmpeg
      - name: Build and smoke native package without a desktop
        run: |
          /usr/bin/python3 -m venv --system-site-packages .packaging-venv
          .packaging-venv/bin/python -m pip install -e '.[packaging]' 'pytest>=8,<10'
          .packaging-venv/bin/python -m pytest -q tests/test_frozen_runtime.py
          .packaging-venv/bin/python scripts/build_release.py
          .packaging-venv/bin/python scripts/ci/archive_frozen_artifact.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoothcast-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: PyInstaller / macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Homebrew's matching native Python and GTK runtime
        run: |
          brew install python pygobject3 gtk4 libadwaita gstreamer gst-plugins-good ffmpeg
      - name: Build and smoke native package without a desktop
        run: |
          BREW_PYTHON="$(brew --prefix)/bin/python3"
          "$BREW_PYTHON" -m venv --system-site-packages .packaging-venv
          .packaging-venv/bin/python -m pip install -e '.[packaging]' pytest
          .packaging-venv/bin/python -m pytest -q tests/test_frozen_runtime.py
          .packaging-venv/bin/python scripts/build_release.py
          .packaging-venv/bin/python scripts/ci/archive_frozen_artifact.py
          .packaging-venv/bin/python scripts/ci/build_macos_dmg.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoothcast-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.dmg
          if-no-files-found: error

  windows:
    name: PyInstaller / Windows UCRT64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-zeroconf
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-yt-dlp
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-ffmpeg
      # Pinned WiX v6 CLI tool (#534). The build script refuses other majors.
      - name: Install pinned WiX v6
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          "SMOOTHCAST_WIX=$env:USERPROFILE\.dotnet\tools\wix.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SMOOTHCAST_GIT=$((Get-Command git).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and smoke native package without a desktop
        shell: msys2 {0}
        run: |
          python -m venv --system-site-packages .packaging-venv
          if test -x .packaging-venv/bin/python; then
            VENV_PY=.packaging-venv/bin/python
          elif test -x .packaging-venv/Scripts/python.exe; then
            VENV_PY=.packaging-venv/Scripts/python.exe
          else
            echo "MSYS2 venv Python executable not found" >&2
            exit 1
          fi
          "$VENV_PY" -m pip install -e '.[packaging]' 'pytest>=8,<10'
          "$VENV_PY" -m pytest -q tests/test_frozen_runtime.py
          "$VENV_PY" scripts/build_release.py
      # Static manifest + PE checks only (#528); nothing is launched but the
      # frozen CLI. Blocking: the allow-list is proven by native Windows runs.
      - name: Record and verify Windows payload manifest
        shell: msys2 {0}
        run: |
          if test -x .packaging-venv/bin/python; then VENV_PY=.packaging-venv/bin/python; else VENV_PY=.packaging-venv/Scripts/python.exe; fi
          "$VENV_PY" scripts/ci/verify_windows_payload.py --dist dist/SmoothCast --write-manifest
      # #528: prove the frozen CLI runs with developer Python/MSYS2 removed
      # from PATH, from a temporary directory with spaces and non-ASCII chars.
      - name: Smoke frozen CLI off the developer PATH
        shell: msys2 {0}
        run: |
          SMOKE="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/SmoothCast smoke ✓.XXXX")"
          cp -r dist/SmoothCast "$SMOKE/"
          RUNTIME_PATH="/c/Windows/System32:/c/Windows"
          env -u PYTHONPATH -u MSYSTEM PATH="$RUNTIME_PATH" "$SMOKE/SmoothCast/SmoothCastCLI.exe" --version
          env -u PYTHONPATH -u MSYSTEM PATH="$RUNTIME_PATH" "$SMOKE/SmoothCast/SmoothCastCLI.exe" --_smoothcast-package-check
          rm -rf "$SMOKE"
      - name: Build Windows MSI with one command
        shell: msys2 {0}
        run: |
          if test -x .packaging-venv/bin/python; then VENV_PY=.packaging-venv/bin/python; else VENV_PY=.packaging-venv/Scripts/python.exe; fi
          "$VENV_PY" scripts/build_windows_msi.py --skip-pyinstaller --json
      - name: Archive Windows artefact
        shell: msys2 {0}
        run: |
          if test -x .packaging-venv/bin/python; then VENV_PY=.packaging-venv/bin/python; else VENV_PY=.packaging-venv/Scripts/python.exe; fi
          "$VENV_PY" scripts/ci/archive_frozen_artifact.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoothcast-windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  windows-msi-install:
    name: Windows MSI / install repair uninstall
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoothcast-windows
          path: candidate
      - name: Validate lifecycle harness without installing
        shell: pwsh
        run: py -3 -m unittest discover -s tests -p 'test_smoke_windows_msi.py' -v
      - name: Install, repair and uninstall exact MSI (headless)
        shell: pwsh
        run: py -3 scripts/ci/smoke_windows_msi.py --disposable-ci --candidate-dir candidate --report dist/windows-msi-test-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-msi-lifecycle
          path: |
            dist/windows-msi-test-results.json
            dist/*.log
          if-no-files-found: warn
