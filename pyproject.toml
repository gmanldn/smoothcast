[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothcast"
dynamic = ["version"]
description = "Chromecast companion app with GTK4/libadwaita UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "catt>=0.12,<0.14",
    "PyChromecast>=13.1.0,<15",
    "psutil>=5.9,<8",  # Verified process identity and native LAN discovery
    "segno>=1.6,<2",
    "zeroconf>=0.132,<1",  # Friendly LAN dashboard hostname advertisement
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "hypothesis",
    "PyYAML>=6,<7",
    "pillow>=11,<14",  # Exercise optional join-slate rendering in headless CI
]

packaging = [
    "pyinstaller>=6.21,<7",
    "pillow>=11,<14",
]

[project.scripts]
smoothcast = "cli:main"
sc = "cli:main"

[project.gui-scripts]
smoothcast-gui = "cli:main"

