[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothcast"
dynamic = ["version"]
description = "Chromecast companion app with GTK4/libadwaita UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "catt>=0.12,<0.14",
    "PyChromecast>=13.1.0,<15",
    "psutil>=5.9,<8",  # Verified process identity and native LAN discovery
    "zeroconf>=0.132,<1",  # Friendly LAN dashboard hostname advertisement
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "hypothesis",
]

packaging = [
    "pyinstaller>=6.21,<7",
    "pillow>=11,<14",
]

[project.scripts]
smoothcast = "cli:main"
sc = "cli:main"

[project.gui-scripts]
smoothcast-gui = "cli:main"

[tool.setuptools]
packages = ["smoothcast_assets"]
py-modules = [
    "frozen_entry", "frozen_runtime", "audio_downmix", "loudness", "subtitle_style", "cast_control", "castctl", "cast_targets", "pychromecast_backend", "config_control", "audio_monitor", "server", "update_control",
    "cache_policy", "buffer_health", "notifications", "idle_chrome", "accent", "picture_check", "video_policy", "language_prefs", "control_api", "progress_model", "issue_report", "cli_control", "sleep_fade", "hw_encoder_state", "process_priority", "error_log", "utils", "screenshot", "position_tracker", "playback_state",
    "ui_theme", "responsive_layout", "density", "text_fit", "url_control", "version",
    "local_playback", "startup_cleanup", "streamer", "stream_watchdog", "direct_probe", "network_routes", "network_route_ui", "subtitle_restart", "subtitle_delay", "playlist_control", "cli", "subtitle_encoding", "preflight", "gui_test_safety", "dlna", "diagnostics",
    "async_jobs", "process_identity", "lan_interfaces", "portal", "portal_uploads", "cast_portal", "network_activity", "network_activity_ui", "cache_privacy", "ffmpeg_compat", "hls_pause_recovery", "cast_widgets", "bookmark_ui", "cast_ui", "cast_settings", "cast_queue", "cast_session", "cast_av", "cast_subtitle_files", "cast_lifecycle", "cast_subtitles", "cast_audio_sync", "audio_delay", "watch_history", "bookmarks", "benchmark", "library_index", "queue_metadata",
    "preferences_ui", "preference_choices", "music_autogain", "mpris", "queue_prewarm_ui", "reliability_metrics",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
smoothcast_assets = ["local.cast-control.png"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Lint gate (CI + pre-commit): correctness rules only, so the gate flags real
# defects without churning the whole code base. Run: ruff check src scripts setup tests
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # sys.path.insert(0, ".../src") before the import is the repo-wide test and
    # script idiom; imports cannot precede it.
    "E402",
]

[tool.ruff.format]
# Configured for opt-in use; the gate is lint-only until the tree is reformatted.
quote-style = "double"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = false
skip_empty = true

# Incremental type checking (#251): only modules listed here are gated. Add a
# module once `mypy` is clean for it; GTK-facing modules are out of scope until
# typed. Run: mypy (reads this table).
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
    "src/playlist_control.py", "src/version.py", "src/utils.py",
    "src/watch_history.py", "src/queue_metadata.py", "src/reliability_metrics.py", "src/preflight.py",
    "src/network_routes.py", "src/dlna.py", "src/server.py", "src/cache_policy.py", "src/hw_encoder_state.py", "src/cli_control.py", "src/accent.py", "src/video_policy.py", "src/language_prefs.py", "src/control_api.py", "src/progress_model.py", "src/density.py", "src/responsive_layout.py", "src/audio_delay.py",
    "src/pychromecast_backend.py",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
