[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
smoothcast_assets = ["local.cast-control.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: pure and fast, no sockets/subprocess (auto-tagged by tests/conftest.py; the ship gate, #699)",
    "contract: ports exercised against fakes (#699)",
    "integration: loopback HTTP, subprocesses or real ffmpeg on tiny fixtures (#699)",
    "e2e: isolated Xvfb or hardware, opt-in (#699)",
    "multicast: requires loopback mDNS multicast support and skips cleanly when unavailable",
    "perf: performance gates (opt-in with SMOOTHCAST_PERF=1; CI runs them in the search-performance job)",
]
# Lint gate (CI + pre-commit): correctness rules only, so the gate flags real
# defects without churning the whole code base. Run: ruff check src scripts setup tests
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # sys.path.insert(0, ".../src") before the import is the repo-wide test and
    # script idiom; imports cannot precede it.
    "E402",
]

[tool.ruff.format]
# Configured for opt-in use; the gate is lint-only until the tree is reformatted.
quote-style = "double"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = false
skip_empty = true

# Incremental type checking (#251): only modules listed here are gated. Add a
# module once `mypy` is clean for it; GTK-facing modules are out of scope until
# typed. Run: mypy (reads this table).
