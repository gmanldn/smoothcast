[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothcast"
dynamic = ["version"]
description = "Chromecast companion app with GTK4/libadwaita UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "catt>=0.12,<0.14",
    "PyChromecast>=13.1.0,<15",
    "psutil>=5.9,<8",  # Verified process identity and native LAN discovery
    "segno>=1.6,<2",
    "zeroconf>=0.132,<1",  # Friendly LAN dashboard hostname advertisement
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "hypothesis",
    "PyYAML>=6,<7",
]

packaging = [
    "pyinstaller>=6.21,<7",
    "pillow>=11,<14",
]

[project.scripts]
smoothcast = "cli:main"
sc = "cli:main"

[project.gui-scripts]
smoothcast-gui = "cli:main"

[tool.setuptools]
packages = ["smoothcast_assets"]
py-modules = [
    "frozen_entry", "frozen_runtime", "audio_downmix", "loudness", "subtitle_style", "cast_control", "castctl", "state_labels", "cast_targets", "pychromecast_backend", "config_control", "config_persistence", "audio_monitor", "server", "update_control",
    "cache_policy", "buffer_health", "hdr_tonemap", "notifications", "idle_chrome", "idle_timers", "accent", "picture_check", "video_policy", "language_prefs", "control_api", "progress_model", "issue_report", "cli_control", "sleep_fade", "hw_encoder_state", "process_priority", "error_log", "utils", "screenshot", "position_tracker", "playback_state",
    "ui_theme", "responsive_layout", "density", "text_fit", "url_control", "version",
    "local_playback", "startup_cleanup", "streamer", "stream_watchdog", "direct_probe", "network_routes", "network_route_ui", "subtitle_restart", "subtitle_delay", "playlist_control", "cli", "subtitle_encoding", "preflight", "gui_test_safety", "dlna", "diagnostics", "font_attachments",
    "async_jobs", "process_identity", "lan_interfaces", "portal", "lan_guard", "library_folders", "library_folders_ui", "fingerprint", "media_names", "library_index_v2", "search_query", "search_engine", "library_replication", "replica_store", "replica_manager", "portal_join", "peer_discovery", "mesh_transport", "mesh_membership", "mesh_sync", "mesh_cache", "mesh_clients", "portal_mesh_http", "mesh_roles", "mesh_visibility", "mesh_state", "shortcut_map", "mesh_rpc", "peer_discovery_ui", "portal_upload_recovery", "portal_commands", "portal_uploads", "cast_portal", "network_activity", "network_activity_ui", "cache_privacy", "room_checkpoint", "room_checkpoint_ui", "ffmpeg_compat", "hls_pause_recovery", "cast_widgets", "bookmark_ui", "cast_ui", "cast_settings", "cast_queue", "cast_session", "cast_av", "cast_subtitle_files", "cast_lifecycle", "cast_ui_timers", "cast_subtitles", "cast_audio_sync", "audio_delay", "watch_history", "bookmarks", "benchmark", "library_index", "queue_metadata", "preferences_ui", "preference_choices", "music_autogain", "mpris", "queue_prewarm_ui", "queue_row_ui", "reliability_metrics", "music_import", "music_import_ui", "cast_portal_queue", "cast_portal_host", "portal_room", "portal_screens", "portal_screens_http", "portal_screen_page", "portal_media", "mesh_model", "mesh_ports", "mesh_beacon", "mesh_udp",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
smoothcast_assets = ["local.cast-control.png"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Lint gate (CI + pre-commit): correctness rules only, so the gate flags real
# defects without churning the whole code base. Run: ruff check src scripts setup tests
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # sys.path.insert(0, ".../src") before the import is the repo-wide test and
    # script idiom; imports cannot precede it.
    "E402",
]

[tool.ruff.format]
# Configured for opt-in use; the gate is lint-only until the tree is reformatted.
quote-style = "double"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = false
skip_empty = true

# Incremental type checking (#251): only modules listed here are gated. Add a
# module once `mypy` is clean for it; GTK-facing modules are out of scope until
# typed. Run: mypy (reads this table).
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
    "src/playlist_control.py", "src/version.py", "src/utils.py",
    "src/watch_history.py", "src/queue_metadata.py", "src/reliability_metrics.py", "src/preflight.py",
    "src/network_routes.py", "src/dlna.py", "src/server.py", "src/cache_policy.py", "src/hw_encoder_state.py", "src/cli_control.py", "src/accent.py", "src/video_policy.py", "src/language_prefs.py", "src/control_api.py", "src/progress_model.py", "src/density.py", "src/responsive_layout.py", "src/idle_timers.py", "src/audio_delay.py",
    "src/pychromecast_backend.py", "src/lan_guard.py", "src/library_folders.py", "src/fingerprint.py", "src/media_names.py", "src/library_index_v2.py", "src/search_query.py", "src/search_engine.py", "src/library_replication.py", "src/replica_store.py", "src/replica_manager.py", "src/portal_room.py", "src/peer_discovery.py", "src/mesh_transport.py", "src/mesh_membership.py", "src/mesh_sync.py", "src/mesh_cache.py", "src/mesh_clients.py", "src/mesh_roles.py", "src/mesh_visibility.py", "src/mesh_state.py", "src/mesh_rpc.py",
    "src/portal_screens.py", "src/portal_media.py", "src/portal_screens_http.py", "src/mesh_model.py", "src/mesh_ports.py", "src/mesh_beacon.py", "src/mesh_udp.py",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
