[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothcast"
dynamic = ["version"]
description = "Chromecast companion app with GTK4/libadwaita UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "catt>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
smoothcast = "cli:main"
sc = "cli:main"

[project.gui-scripts]
smoothcast-gui = "cli:main"

[tool.setuptools]
py-modules = [
    "cast_control", "castctl", "config_control", "audio_monitor", "server", "update_control",
    "error_log", "utils", "screenshot", "position_tracker", "playback_state",
    "ui_theme", "responsive_layout", "url_control", "version",
    "local_playback", "startup_cleanup", "streamer", "stream_watchdog", "playlist_control", "cli", "subtitle_encoding", "preflight", "gui_test_safety", "dlna", "diagnostics",
    "cast_widgets", "cast_ui", "cast_queue", "cast_session", "cast_av", "cast_lifecycle",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]